# BorderDay: local Supabase CLI skeleton (`supabase start`). Production is the EU `fig-mail`
# project; migrations under supabase/migrations/ are the source of truth for it.

[project]
id = "borderday-local"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 15

[functions.bd-contract-request]
# The withdrawal and cancellation forms work signed out; the function validates and rate-limits itself.
verify_jwt = false

[functions.bd-auth-send-email]
# Auth Send Email Hook verifies with SEND_EMAIL_HOOK_SECRET (Standard Webhooks), not a user JWT.
verify_jwt = false

[functions.bd-stripe-webhook]
# Stripe signs the body; there is no user JWT. A plain deploy with the default (true) would 401 every delivery.
verify_jwt = false
